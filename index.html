<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Sudoku</h1>
      <div class="controls">
        <select id="difficulty" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="new-game">New game</button>
      </div>
    </header>

    <div class="status">
      <span>Time: <strong id="timer">00:00</strong></span>
      <span>Mistakes: <strong id="mistakes">0</strong></span>
    </div>

    <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>

    <div class="numpad" id="numpad"></div>

    <div class="actions">
      <button id="notes-toggle">Notes: off</button>
      <button id="erase">Erase</button>
      <button id="hint">Hint</button>
      <button id="check">Check</button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>
  </main>

  <div id="win-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Solved!</h2>
      <p id="win-text"></p>
      <button id="win-new">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
